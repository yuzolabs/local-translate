[project]
name = "local-translate"
version = "0.1.0"
description = "Fully local translation and speech companion for the Chrome extension"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11",
  "huggingface_hub>=0.27",
]

[project.scripts]
local-translate-daemon = "local_translate.daemon:main"
local-translate-host = "local_translate.nm_host:main"
local-translate-verify-asr = "local_translate.asr_verify:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_translate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
